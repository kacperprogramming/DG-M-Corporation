<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG&M Corporation</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/hamburger.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/a127b0651a.js" crossorigin="anonymous"></script>
</head>

<body>

    <header class="header">
        <nav class="nav nav-mobile">
            <button class="hamburger hamburger--spin" type="button">
                <span class="hamburger-box">
                    <span class="hamburger-inner"></span>
                </span>
            </button>

            <div class="nav__links-mobile">
                <a class="nav__link-mobile" href="#">Invest</a>
                <a class="nav__link-mobile" href="#">Plan</a>
                <a class="nav__link-mobile" href="#">Contact</a>
            </div>
        </nav>

        <nav class="nav nav-desktop">
            <div class="nav__links-desktop">
                <a class="nav__link-desktop" href="#">Invest</a>
                <a class="nav__link-desktop" href="#">Plan</a>
                <a class="nav__link-desktop" href="#">Contact</a>
            </div>
        </nav>

        <div class="header__text">
            <h1 class="header__text-title">Diamonds, Gold & Money</h1>
            <p class="header__text-content">Lorem ipsum dolor sit amet consectetur adipisicing elit. Maiores nobis iusto.</p>
        </div>

        <div class="header__img">
            <div class="header__img-shadow"></div>
        </div>
        
        <img class="header__bg-icon-one" src="img/icons/square.svg"></img>
        <img class="header__bg-icon-two" src="img/icons/square.svg"></img>
    </header>

    <footer class="footer">
        <p class="footer__bottom-text"></p>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
